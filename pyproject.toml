[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iban-pure"
version = "0.1.0"
description = "Zero-dependency pure-stdlib IBAN mod-97 validator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["iban_pure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
